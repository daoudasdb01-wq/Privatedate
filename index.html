<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanvue - Jenny AI image</title>
    <!-- Chargement des icônes professionnelles -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* Thème sombre premium */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0b0914; 
            color: #ffffff; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
        }
        
        .wrapper { 
            max-width: 420px; 
            width: 100%;
            background: #12101c; 
            min-height: 100vh;
            position: relative;
        }

        /* Bannière de profil */
        .banner {
            width: 100%;
            height: 140px;
            background: linear-gradient(135px, #3b0066, #8000ff);
        }

        /* Contenu du profil */
        .profile-container {
            padding: 0 15px;
            margin-top: -45px;
            position: relative;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .avatar {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            border: 3px solid #12101c;
            background-color: #252238;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .follow-btn {
            background-color: #252238;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .display-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }
        .display-name {
            font-size: 22px;
            font-weight: 700;
        }
        .ai-tag {
            background-color: #252238;
            color: #a3a3c2;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #3d3d5c;
        }

        .username {
            font-size: 14px;
            color: #a3a3c2;
            margin-bottom: 12px;
        }

        /* Compteurs avec icônes */
        .counters {
            display: flex;
            gap: 18px;
            font-size: 13px;
            color: #ffffff;
            margin-bottom: 15px;
        }
        .counters span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .counters i {
            color: #a3a3c2;
        }

        .bio {
            font-size: 13px;
            color: #e1e1e6;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        /* Bouton vert Fanvue */
        .join-btn {
            display: block;
            background-color: #00ff66; 
            color: #000000;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Onglets */
        .tabs {
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #252238;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
            color: #a3a3c2;
        }
        .tab-active { color: #ffffff; border-bottom: 2px solid #ffffff; padding-bottom: 8px; }

        /* Filtres médias */
        .filters {
            display: flex;
            gap: 8px;
            padding: 0 15px;
            margin-bottom: 15px;
        }
        .filter-badge {
            background-color: #252238;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .filter-badge-active { background-color: #ffffff; color: #000000; }

        /* Grille de photos floutées */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            padding: 0 10px 20px 10px;
        }
        .grid-item {
            aspect-ratio: 0.85;
            background-color: #1a1726;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px solid #252238;
        }
        /* Utilisation de votre photo de profil pour l'effet de galerie floutée */
        .grid-item::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://styles.redditmedia.com/t5_jnn5la/styles/profileIcon_3yurfu5dhplh1.jpeg?frame=1&auto=webp&crop=256%3A256%2Csmart&s=e916f3c6e1a65ba639aab358f4f7907bf72db2e4');
            background-size: cover;
            background-position: center;
            filter: blur(18px);
            opacity: 0.45;
        }
        .grid-lock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 20px;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 50%;
        }

        /* SYSTEME DE POP-UP FERMABLE */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .popup-card {
            background-color: #ffffff;
            color: #000000;
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            position: relative;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
        }

        .popup-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 20px;
            color: #8c8c8c;
            cursor: pointer;
            padding: 5px;
        }

        .popup-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #f3f3f6;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .popup-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .popup-title {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .popup-desc {
            font-size: 13px;
            color: #595959;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        /* Lien d'affiliation CPA */
        .popup-cta {
            display: block;
            background-color: #12101c; 
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .popup-login {
            font-size: 14px;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Bannière supérieure -->
    <div class="banner"></div>

    <!-- Zone Profil -->
    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar">
                <img src="https://styles.redditmedia.com/t5_jnn5la/styles/profileIcon_3yurfu5dhplh1.jpeg?frame=1&auto=webp&crop=256%3A256%2Csmart&s=e916f3c6e1a65ba639aab358f4f7907bf72db2e4" alt="Jenny">
            </div>
            <button class="follow-btn">Suivre gratuitement</button>
        </div>

        <div class="display-name-row">
            <span class="display-name">Jenny AI image</span>
            <span class="ai-tag">AI</span>
        </div>
        <div class="username">@Jenny9726</div>

        <!-- Compteurs avec icônes -->
        <div class="counters">
            <span><i class="fa-regular fa-image"></i> 355</span>
            <span><i class="fa-solid fa-video"></i> 6</span>
            <span><i class="fa-solid fa-heart"></i> 23</span>
        </div>

        <div class="bio">
            Retrouvez mes créations d'images IA privées et mes albums exclusifs... <span style="color:#a3a3c2; cursor:pointer;">voir plus</span>
        </div>

        <div class="join-btn">Rejoindre gratuitement</div>
    </div>

    <!-- Onglets -->
    <div class="tabs">
        <div>Publications (0)</div>
        <div class="tab-active">Médias (361)</div>
    </div>

    <!-- Filtres -->
    <div class="filters">
        <div class="filter-badge filter-badge-active">Tout 361</div>
        <div class="filter-badge">Photos 355</div>
        <div class="filter-badge">Vidéos 6</div>
    </div>
