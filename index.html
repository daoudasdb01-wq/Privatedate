<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny AI image</title>
    <style>
        /* DESIGN PREMIUM ET CLEAN */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0b0914; 
            color: #ffffff; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
        }
        
        .wrapper { 
            max-width: 420px; 
            width: 100%;
            background: #12101c; 
            min-height: 100vh;
            padding: 0 16px 40px 16px;
            box-sizing: border-box;
        }

        /* DESIGN DE L'AVATAR (SANS TEXTE PAR-DESSUS) */
        .avatar-container {
            text-align: center;
            padding-top: 40px;
            margin-bottom: 15px;
        }
        .avatar-circle { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            border: 3px solid #bd00ff;
            background: #252238;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
        }
        
        /* NOM ET INFOS UTILISATEUR */
        h1 { 
            font-size: 24px; 
            margin: 0 0 4px 0; 
            text-align: center;
            font-weight: 700;
        }
        .username {
            font-size: 14px;
            color: #a3a3c2;
            text-align: center;
            margin-bottom: 20px;
        }
        
        /* TEXTE DE BIO REPLICABLE */
        .bio { 
            font-size: 14px; 
            color: #e1e1e6; 
            margin-bottom: 30px; 
            line-height: 1.5;
            text-align: center;
        }

        /* STATISTIQUES STATIQUES CONFORMES */
        .tabs-row {
            display: flex;
            justify-content: space-around;
            border-bottom: 1px solid #252238;
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: bold;
            color: #a3a3c2;
        }
        .tab-active { color: #ffffff; border-bottom: 2px solid #ffffff; padding-bottom: 8px; }

        /* GRILLE DE 10 PHOTOS FLOUTÉES FICTIVES */
        .photo-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            margin-bottom: 35px; 
        }
        .photo-item { 
            aspect-ratio: 0.85; 
            background: linear-gradient(45px, #1a1726, #252238);
            border-radius: 10px; 
            position: relative;
            border: 1px solid #3d3d5c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* LE BOUTON CPA MASSIF UNIQUE (SANS POP-UP SPAMMY) */
        .cta-btn { 
            display: block; 
            background: #00ff66; 
            color: #000000; 
            text-decoration: none; 
            text-align: center;
            padding: 16px; 
            font-weight: bold; 
            border-radius: 30px; 
            font-size: 16px; 
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cta-btn:hover {
            background: #00e65c;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Section Avatar -->
    <div class="avatar-container">
        <div class="avatar-circle">✨</div>
    </div>
    
    <!-- Profil Jenny -->
    <h1>Jenny AI image</h1>
    <div class="username">@Jenny9726</div>
    
    <p class="bio">
        Bienvenue sur mon espace privé ! Retrouvez mes 355 créations exclusives d'images IA non censurées et mon tchat interactif en direct.
    </p>

    <!-- Onglets Profil -->
    <div class="tabs-row">
        <div>Publications (28)</div>
        <div class="tab-active">Médias (361)</div>
    </div>
    
    <!-- Grille stable de 10 albums verrouillés -->
    <div class="photo-grid">
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
        <div class="photo-item">🔒</div>
    </div>
    
    <!-- BOUTON DE CONVERSION UNIQUE DIRECT -->
    <!-- Remplacez le "#" par votre futur lien d'affiliation CPA -->
    <a href="#" class="cta-btn">🔓 Débloquer mes photos privées</a>
</div>

</body>
</html>
